[workspace]
resolver = "2"
members = ["crates/gd3-core", "crates/gd3-net", "crates/gd3-py", "crates/gd3-servers", "crates/gd3-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
regex = "1.13"
flate2 = "1.1"

[profile.release]
lto = true
codegen-units = 1
# 构建机只有 939MB 内存 + 2 核：默认 debug=2 的调试信息让 gd3-ui 的测试二进制
# 链接一次要 >16 分钟（链接器在 swap 上抖动）。关掉调试信息、关掉 incremental
# （incremental 目录在磁盘紧张时是最大可回收项，且我们总是跑全量测试构建）。
[profile.dev]
debug = 0
incremental = false
