[workspace]
resolver = "2"
members = ["crates/gd3-core", "crates/gd3-net", "crates/gd3-py", "crates/gd3-servers", "crates/gd3-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
regex = "1.13"

[profile.release]
lto = true
codegen-units = 1
