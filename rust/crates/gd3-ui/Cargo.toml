[package]
name = "gd3-ui"
version = "0.1.0"
edition = "2024"
description = "Ghost-Downloader-3 的 Slint UI crate（Phase 7 起步；strangler 逐页迁移）"
license = "GPL-3.0"

[dependencies]
flate2.workspace = true
gd3-core = { path = "../gd3-core" }
gd3-net = { path = "../gd3-net" }
regex.workspace = true
serde_json.workspace = true
slint = "1.18.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
    "fs",
] }
uuid.workspace = true

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
serde_json.workspace = true

